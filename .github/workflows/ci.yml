# CI for pull requests: build the Eleventy site from the LaTeX source, verify.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify (Eleventy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Copy self-hosted MathJax + MiniSearch bundles
        run: npm run update:vendor

      - name: Build with Eleventy (site + search index)
        run: npm run build

      - name: Verify build
        run: npm run verify
